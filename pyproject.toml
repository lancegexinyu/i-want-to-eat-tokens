[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i-want-to-eat-tokens"
version = "0.1.0"
description = "这是一个笑话 / 整活版本，不是正经工具。它只烧掉你自己的钱：消耗的是你自己的 API token。它不会把钱转给作者，也不会把钱转给其他任何人。它真的会消耗 token：这是真实的 API 调用，会产生真实的花费。它不是会在后台偷偷消耗 token 的恶意软件。你必须自己提供密钥，并且在任何花费发生之前明确确认。 This is a joke / troll (整活) version, not a useful tool. It only burns your own money by consuming your own API tokens. It does not transfer money to the author, and it does not transfer money to anyone else. It really does consume tokens: real API usage and real spend. It is not malware that secretly consumes tokens in the background. You must supply your own key and explicitly confirm before any spend."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lancegexinyu" }]
keywords = ["joke", "troll", "satire", "tokens", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lancegexinyu/i-want-to-eat-tokens"
Repository = "https://github.com/lancegexinyu/i-want-to-eat-tokens"

[project.scripts]
eat-tokens = "eat_tokens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
